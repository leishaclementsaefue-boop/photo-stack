      - run:
          command: /bin/sleep 30
      - run:
          no_output_timeout: 120m
          command: "$PWD/proxy-bin"
  gate_v1-preview:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Count fixture lines
          command: |
            mkdir -p /tmp/stage
            { seq 1 20000000 | awk '{print "circleci"}' | wc -l ; } > /tmp/stage/v1-preview.log
            echo "gate v1-preview: $(wc -c </tmp/stage/v1-preview.log) bytes total"
